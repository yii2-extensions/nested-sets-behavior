---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"
      - "UPGRADE.md"

  push: *ignore-paths

name: build-pgsql

permissions:
  contents: read

jobs:
  pgsql:
    name: PostgreSQL tests.
    uses: yii2-framework/actions/.github/workflows/phpunit-database.yml@f0e06ea5cc965cff4431177d448add7b7c98668b # v2.0.1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      concurrency-group: pgsql-${{ github.ref }}
      database-env: |
        {
          "POSTGRES_DB": "yiitest",
          "POSTGRES_USER": "root",
          "POSTGRES_PASSWORD": "root"
        }
      database-health-cmd: "pg_isready -U postgres"
      database-health-retries: 3
      database-image: postgres
      database-port: 5432
      database-type: pgsql
      database-versions: '["15", "16", "17"]'
      enable-concurrency: true
      extensions: pdo, pdo_pgsql
      os: '["ubuntu-latest"]'
      php-version: '["8.4"]'
      phpunit-group: pgsql
