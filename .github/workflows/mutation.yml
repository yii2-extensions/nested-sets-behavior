---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"
      - "UPGRADE.md"

  push: *ignore-paths

name: mutation test

permissions:
  contents: read

jobs:
  mutation:
    uses: yii2-framework/actions/.github/workflows/infection.yml@f0e06ea5cc965cff4431177d448add7b7c98668b # v2.0.1
    with:
      before-hook: |
        docker run -d \
          --name mysql-test \
          -e MYSQL_ROOT_PASSWORD=root \
          -e MYSQL_DATABASE=yiitest \
          -p 3306:3306 \
          --health-cmd="mysqladmin ping -h localhost" \
          --health-interval=10s \
          --health-timeout=5s \
          --health-retries=5 \
          mysql:8.4

        docker run -d \
          --name postgres-test \
          -e POSTGRES_DB=yiitest \
          -e POSTGRES_USER=root \
          -e POSTGRES_PASSWORD=root \
          -p 5432:5432 \
          --health-cmd="pg_isready -U root" \
          --health-interval=10s \
          --health-timeout=5s \
          --health-retries=3 \
          postgres:17

        echo "Waiting for MySQL to be ready..."
        timeout 120s bash -c 'until docker exec mysql-test mysqladmin ping -h localhost --silent; do sleep 3; done'

        echo "Waiting for PostgreSQL to be ready..."
        timeout 60s bash -c 'until docker exec postgres-test pg_isready -U root; do sleep 2; done'

        # Each Infection worker uses its own disposable database; see docs/testing.md.
        for token in initial 1 2 3 4; do
          docker exec mysql-test mysql -u root -proot -e "CREATE DATABASE yiitest_${token};"
          docker exec postgres-test createdb -U root "yiitest_${token}"
        done

        echo 'NESTED_SETS_TEST_MYSQL_DSN=mysql:host=127.0.0.1;port=3306;dbname=yiitest_{token};charset=utf8mb4' >> "$GITHUB_ENV"
        echo 'NESTED_SETS_TEST_PGSQL_DSN=pgsql:host=127.0.0.1;port=5432;dbname=yiitest_{token}' >> "$GITHUB_ENV"
      command-options: --threads=4
      extensions: pdo, pdo_mysql, pdo_pgsql, pdo_sqlite
      php-ini-values: date.timezone='UTC', memory_limit=-1
      phpstan: true
    secrets:
      STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
