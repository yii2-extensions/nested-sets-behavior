---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"
      - "UPGRADE.md"

  push: *ignore-paths

name: build-oracle

permissions:
  contents: read

jobs:
  oracle:
    name: Oracle tests.
    uses: yii2-framework/actions/.github/workflows/phpunit-database.yml@f0e06ea5cc965cff4431177d448add7b7c98668b # v2.0.1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      concurrency-group: oracle-${{ github.ref }}
      database-env: |
        {
          "ORACLE_DATABASE": "yiitest",
          "ORACLE_PASSWORD": "root"
        }
      database-health-cmd: "healthcheck.sh"
      database-health-retries: 10
      database-image: gvenzl/oracle-free
      database-port: 1521
      database-type: oci
      database-versions: '["23"]'
      enable-concurrency: true
      extensions: pdo, pdo_oci
      os: '["ubuntu-latest"]'
      php-version: '["8.3"]'
      phpunit-group: oci
