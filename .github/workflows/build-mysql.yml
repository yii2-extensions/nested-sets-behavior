---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"
      - "UPGRADE.md"

  push: *ignore-paths

name: build-mysql

permissions:
  contents: read

jobs:
  mysql:
    name: MySQL tests.
    uses: yii2-framework/actions/.github/workflows/phpunit-database.yml@e3e99bd1c54fb350911bf446690e6146acf7660d # v2.0.6
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      concurrency-group: mysql-${{ github.ref }}
      database-env: |
        {
          "MYSQL_DATABASE": "yiitest",
          "MYSQL_ROOT_PASSWORD": "root"
        }
      database-health-cmd: "mysqladmin ping"
      database-health-retries: 3
      database-image: mysql
      database-port: 3306
      database-type: mysql
      database-versions: '["8.0", "8.4", "latest"]'
      enable-concurrency: true
      extensions: pdo, pdo_mysql, sodium
      ignore-platform-reqs-php-version: "[8.6]"
      os: '["ubuntu-latest"]'
      php-version: "[8.3, 8.6]"
      phpunit-group: mysql
