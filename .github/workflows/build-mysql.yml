---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"
      - "UPGRADE.md"

  push: *ignore-paths

name: build-mysql

permissions:
  contents: read

jobs:
  mysql:
    name: MySQL tests.
    uses: yii2-framework/actions/.github/workflows/phpunit-database.yml@f0e06ea5cc965cff4431177d448add7b7c98668b # v2.0.1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      concurrency-group: mysql-${{ github.ref }}
      database-env: |
        {
          "MYSQL_DATABASE": "yiitest",
          "MYSQL_ROOT_PASSWORD": "root"
        }
      database-health-cmd: "mysqladmin ping"
      database-health-retries: 3
      database-image: mysql
      database-port: 3306
      database-type: mysql
      database-versions: '["8.0", "8.4", "latest"]'
      enable-concurrency: true
      extensions: pdo, pdo_mysql
      os: '["ubuntu-latest"]'
      php-version: '["8.4"]'
      phpunit-group: mysql
